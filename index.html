<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PageVault — Mini moteur de recherche</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet"/>
  <style>
    :root{--bg:#0a0a0f;--surface:#111118;--surface2:#1a1a24;--border:#2a2a3a;--accent:#c8f04a;--accent2:#4af0c8;--text:#e8e8f0;--muted:#606078;--danger:#f04a6a;--radius:8px;--font-head:'Syne',sans-serif;--font-mono:'DM Mono',monospace}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    body{background:var(--bg);color:var(--text);font-family:var(--font-mono);min-height:100vh;overflow-x:hidden}
    body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(200,240,74,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(200,240,74,.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
    header{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 2rem;height:56px;background:rgba(10,10,15,.85);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
    .logo{font-family:var(--font-head);font-weight:800;font-size:1.2rem;letter-spacing:-.03em;color:var(--accent)}.logo span{color:var(--text)}
    .header-right{display:flex;align-items:center;gap:1rem;font-size:.75rem;color:var(--muted)}
    #user-status{color:var(--accent2)}
    nav{display:flex;background:var(--surface2);border:1px solid var(--border);border-radius:6px;overflow:hidden}
    nav button{background:none;border:none;color:var(--muted);font-family:var(--font-mono);font-size:.72rem;font-weight:500;letter-spacing:.05em;text-transform:uppercase;padding:.4rem .9rem;cursor:pointer;transition:all .2s}
    nav button:hover{color:var(--text);background:rgba(255,255,255,.04)}
    nav button.active{background:var(--accent);color:#0a0a0f;font-weight:600}
    main{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:80px 1.5rem 4rem}
    .view{display:none}.view.active{display:block}
    .search-hero{text-align:center;padding:3rem 0 2.5rem}
    .search-hero h1{font-family:var(--font-head);font-weight:800;font-size:clamp(2.2rem,6vw,3.8rem);letter-spacing:-.04em;line-height:1;margin-bottom:.5rem}
    .search-hero h1 em{font-style:normal;color:var(--accent)}
    .search-hero p{font-size:.8rem;color:var(--muted);letter-spacing:.06em}
    .search-box{position:relative;margin:2rem 0 0}
    .search-box input{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--font-mono);font-size:1rem;padding:.9rem 1.2rem .9rem 3rem;outline:none;transition:border-color .2s,box-shadow .2s}
    .search-box input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(200,240,74,.12)}
    .search-box input::placeholder{color:var(--muted)}
    .search-icon{position:absolute;left:1rem;top:50%;transform:translateY(-50%);color:var(--muted);font-size:1rem;pointer-events:none}
    #results{margin-top:1.5rem;display:flex;flex-direction:column;gap:.5rem}
    .result-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:.9rem 1.2rem;display:flex;align-items:center;justify-content:space-between;cursor:pointer;transition:all .18s}
    .result-card:hover{border-color:var(--accent);background:var(--surface2);transform:translateX(4px)}
    .result-left{display:flex;align-items:center;gap:.8rem}
    .result-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);flex-shrink:0}
    .result-name{font-family:var(--font-head);font-weight:600;font-size:.95rem}
    .result-meta{font-size:.7rem;color:var(--muted);margin-top:.15rem}
    .result-score{font-size:.65rem;color:var(--accent2);letter-spacing:.08em;background:rgba(74,240,200,.08);border:1px solid rgba(74,240,200,.15);border-radius:4px;padding:.2rem .5rem}
    .empty-state{text-align:center;color:var(--muted);font-size:.8rem;padding:3rem 0;letter-spacing:.06em}
    .auth-card,.creator-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:2rem;max-width:520px;margin:2rem auto 0}
    .card-title{font-family:var(--font-head);font-weight:700;font-size:1.3rem;margin-bottom:1.5rem;letter-spacing:-.02em}.card-title span{color:var(--accent)}
    .field{margin-bottom:1.1rem}
    .field label{display:block;font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:.4rem}
    .field input,.field textarea{width:100%;background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-family:var(--font-mono);font-size:.85rem;padding:.7rem 1rem;outline:none;resize:vertical;transition:border-color .2s}
    .field textarea{min-height:200px;font-size:.78rem;line-height:1.5}
    .field input:focus,.field textarea:focus{border-color:var(--accent)}
    .btn{display:inline-flex;align-items:center;gap:.5rem;background:var(--accent);color:#0a0a0f;font-family:var(--font-head);font-weight:700;font-size:.85rem;padding:.7rem 1.5rem;border:none;border-radius:var(--radius);cursor:pointer;transition:all .18s}
    .btn:hover{background:#d8ff55;transform:translateY(-1px)}
    .btn-secondary{background:transparent;color:var(--text);border:1px solid var(--border)}.btn-secondary:hover{background:var(--surface2);transform:none}
    .btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(240,74,106,.3);font-size:.75rem;padding:.4rem .9rem}.btn-danger:hover{background:rgba(240,74,106,.1);transform:none}
    #btn-signout{display:none}
    .auth-toggle{text-align:center;margin-top:1rem;font-size:.75rem;color:var(--muted)}.auth-toggle a{color:var(--accent2);cursor:pointer;text-decoration:underline}
    .status-msg{padding:.6rem 1rem;border-radius:var(--radius);font-size:.78rem;margin-bottom:1rem;display:none}
    .status-msg.success{background:rgba(200,240,74,.1);border:1px solid rgba(200,240,74,.2);color:var(--accent);display:block}
    .status-msg.error{background:rgba(240,74,106,.1);border:1px solid rgba(240,74,106,.2);color:var(--danger);display:block}
    #page-viewer{position:fixed;inset:0;z-index:200;background:var(--bg);display:none;flex-direction:column}
    #page-viewer.open{display:flex}
    .viewer-bar{height:50px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:1rem;padding:0 1.2rem;flex-shrink:0}
    .viewer-title{font-family:var(--font-head);font-weight:700;font-size:.95rem;flex:1}
    .viewer-author{font-size:.7rem;color:var(--muted)}
    #viewer-frame{flex:1;border:none;background:#fff}
    .pages-list{margin-top:1.5rem;display:flex;flex-direction:column;gap:.5rem}
    .page-item{background:var(--surface2);border:1px solid var(--border);border-radius:var(--radius);padding:.7rem 1rem;display:flex;align-items:center;justify-content:space-between;font-size:.82rem}
    .page-item-name{font-family:var(--font-head);font-weight:600}
    .page-item-date{font-size:.65rem;color:var(--muted)}
    .sep{border:none;border-top:1px solid var(--border);margin:1.5rem 0}
    .section-label{font-size:.65rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:.8rem}
    .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(200,240,74,.3);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<header>
  <div class="logo">Page<span>Vault</span></div>
  <div class="header-right">
    <span id="user-status">non connecté</span>
    <nav>
      <button class="active" onclick="switchView('search')">🔍 Recherche</button>
      <button onclick="switchView('creator')">✦ Créateur</button>
    </nav>
    <button class="btn btn-danger" id="btn-signout" onclick="doSignOut()">Déco</button>
  </div>
</header>

<main>
  <div class="view active" id="view-search">
    <div class="search-hero">
      <h1>Trouve<br/>n'importe quelle <em>page</em></h1>
      <p>// MOTEUR DE RECHERCHE COMMUNAUTAIRE</p>
    </div>
    <div class="search-box">
      <span class="search-icon">⌕</span>
      <input type="text" id="search-input" placeholder="Nom de la page…" autocomplete="off" oninput="handleSearch(this.value)" />
    </div>
    <div id="results"><div class="empty-state">Commence à taper pour chercher une page</div></div>
  </div>

  <div class="view" id="view-creator">
    <div id="auth-panel">
      <div class="auth-card">
        <div class="card-title">Mode <span>Créateur</span></div>
        <div class="status-msg" id="auth-msg"></div>
        <div id="auth-form-login">
          <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="ton@email.com" /></div>
          <div class="field"><label>Mot de passe</label><input type="password" id="login-password" placeholder="••••••••" /></div>
          <button class="btn" onclick="doLogin()">Se connecter</button>
          <div class="auth-toggle">Pas de compte ? <a onclick="toggleAuthForm()">Créer un compte</a></div>
        </div>
        <div id="auth-form-register" style="display:none">
          <div class="field"><label>Email</label><input type="email" id="reg-email" placeholder="ton@email.com" /></div>
          <div class="field"><label>Mot de passe</label><input type="password" id="reg-password" placeholder="••••••••" /></div>
          <button class="btn" onclick="doRegister()">Créer le compte</button>
          <div class="auth-toggle">Déjà un compte ? <a onclick="toggleAuthForm()">Se connecter</a></div>
        </div>
      </div>
    </div>
    <div id="creator-panel" style="display:none">
      <div class="creator-card">
        <div class="card-title">Publier une <span>page</span></div>
        <div class="status-msg" id="publish-msg"></div>
        <div class="field"><label>Nom de la page</label><input type="text" id="page-name" placeholder="Mon super projet…" maxlength="80" /></div>
        <div class="field"><label>Code HTML de la page</label><textarea id="page-html" placeholder="&lt;!DOCTYPE html&gt;&#10;&lt;html&gt;&#10;&lt;body&gt;&#10;&lt;h1&gt;Ma page !&lt;/h1&gt;&#10;&lt;/body&gt;&#10;&lt;/html&gt;"></textarea></div>
        <button class="btn" onclick="doPublish()" id="btn-publish">✦ Publier</button>
        <hr class="sep">
        <div class="section-label">Mes pages publiées</div>
        <div class="pages-list" id="my-pages-list"><div class="empty-state" style="padding:1rem 0">Chargement…</div></div>
      </div>
    </div>
  </div>
</main>

<div id="page-viewer">
  <div class="viewer-bar">
    <button class="btn btn-secondary" style="padding:.4rem .9rem;font-size:.75rem" onclick="closeViewer()">← Retour</button>
    <div class="viewer-title" id="viewer-page-title">—</div>
    <div class="viewer-author" id="viewer-page-author"></div>
  </div>
  <iframe id="viewer-frame" sandbox="allow-scripts allow-same-origin"></iframe>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey:"AIzaSyByZGHTVa45fxbN6lYl4mBgec4LCFrfgQA",
  authDomain:"web-data-a658a.firebaseapp.com",
  projectId:"web-data-a658a",
  storageBucket:"web-data-a658a.firebasestorage.app",
  messagingSenderId:"538907327089",
  appId:"1:538907327089:web:de1d6cae8568a21aa039d0"
});
const auth=firebase.auth();
const db=firebase.firestore();
let allPages=[];

auth.onAuthStateChanged(user=>{
  document.getElementById('user-status').textContent=user?'✦ '+user.email:'non connecté';
  document.getElementById('btn-signout').style.display=user?'inline-block':'none';
  if(document.getElementById('view-creator').classList.contains('active'))refreshCreatorView();
});

async function loadPages(){
  try{
    const snap=await db.collection('pages').orderBy('createdAt','desc').get();
    allPages=snap.docs.map(d=>({id:d.id,...d.data()}));
  }catch(e){console.error(e);}
}
loadPages();

function fuzzyScore(name,q){
  name=name.toLowerCase();q=q.toLowerCase().trim();
  if(name===q)return 100;
  if(name.startsWith(q))return 80;
  if(name.includes(q))return 60;
  let score=0,qi=0;
  for(let ni=0;ni<name.length&&qi<q.length;ni++){if(name[ni]===q[qi]){score++;qi++;}}
  return qi===q.length?Math.round((score/name.length)*40):0;
}

function handleSearch(val){
  const box=document.getElementById('results');
  if(!val.trim()){box.innerHTML='<div class="empty-state">Commence à taper pour chercher une page</div>';return;}
  const results=allPages.map(p=>({...p,score:fuzzyScore(p.name,val)})).filter(p=>p.score>0).sort((a,b)=>b.score-a.score).slice(0,8);
  if(results.length===0){box.innerHTML='<div class="empty-state">Aucune page trouvée pour « '+escHtml(val)+' »</div>';return;}
  box.innerHTML=results.map(p=>`<div class="result-card" onclick="openViewer('${p.id}')"><div class="result-left"><div class="result-dot"></div><div><div class="result-name">${escHtml(p.name)}</div><div class="result-meta">par ${escHtml(p.authorEmail||'anonyme')}</div></div></div><div class="result-score">${p.score}% match</div></div>`).join('');
}

function switchView(name){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.getElementById('view-'+name).classList.add('active');
  document.querySelectorAll('nav button').forEach((b,i)=>{b.classList.toggle('active',(name==='search'&&i===0)||(name==='creator'&&i===1));});
  if(name==='creator')refreshCreatorView();
  if(name==='search')loadPages();
}

function toggleAuthForm(){
  const l=document.getElementById('auth-form-login'),r=document.getElementById('auth-form-register');
  l.style.display=l.style.display==='none'?'block':'none';
  r.style.display=r.style.display==='none'?'block':'none';
  document.getElementById('auth-msg').className='status-msg';
}

function showMsg(id,msg,type){
  const el=document.getElementById(id);
  el.textContent=msg;el.className='status-msg '+type;
  setTimeout(()=>{el.className='status-msg';},5000);
}

function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const pwd=document.getElementById('login-password').value;
  if(!email||!pwd)return showMsg('auth-msg','Remplis tous les champs.','error');
  auth.signInWithEmailAndPassword(email,pwd).then(()=>refreshCreatorView()).catch(e=>showMsg('auth-msg','Erreur : '+e.message,'error'));
}

function doRegister(){
  const email=document.getElementById('reg-email').value.trim();
  const pwd=document.getElementById('reg-password').value;
  if(!email||!pwd)return showMsg('auth-msg','Remplis tous les champs.','error');
  if(pwd.length<6)return showMsg('auth-msg','Mot de passe trop court (6 caractères min).','error');
  auth.createUserWithEmailAndPassword(email,pwd).then(()=>refreshCreatorView()).catch(e=>showMsg('auth-msg','Erreur : '+e.message,'error'));
}

function doSignOut(){auth.signOut().then(()=>refreshCreatorView());}

function refreshCreatorView(){
  const user=auth.currentUser;
  document.getElementById('auth-panel').style.display=user?'none':'block';
  document.getElementById('creator-panel').style.display=user?'block':'none';
  if(user)loadMyPages(user.uid);
}

async function doPublish(){
  const user=auth.currentUser;if(!user)return;
  const name=document.getElementById('page-name').value.trim();
  const html=document.getElementById('page-html').value.trim();
  if(!name)return showMsg('publish-msg','Donne un nom à ta page.','error');
  if(!html)return showMsg('publish-msg','Le HTML est vide.','error');
  const btn=document.getElementById('btn-publish');
  btn.innerHTML='<span class="spinner"></span> Publication…';btn.disabled=true;
  try{
    await db.collection('pages').add({name,html,authorId:user.uid,authorEmail:user.email,createdAt:firebase.firestore.FieldValue.serverTimestamp()});
    document.getElementById('page-name').value='';document.getElementById('page-html').value='';
    showMsg('publish-msg','✦ Page publiée avec succès !','success');
    await loadPages();loadMyPages(user.uid);
  }catch(e){showMsg('publish-msg','Erreur : '+e.message,'error');}
  btn.innerHTML='✦ Publier';btn.disabled=false;
}

async function loadMyPages(uid){
  const list=document.getElementById('my-pages-list');
  list.innerHTML='<div class="empty-state" style="padding:.5rem 0">Chargement…</div>';
  try{
    const snap=await db.collection('pages').where('authorId','==',uid).orderBy('createdAt','desc').get();
    if(snap.empty){list.innerHTML='<div class="empty-state" style="padding:.5rem 0;font-size:.75rem">Aucune page publiée</div>';return;}
    list.innerHTML=snap.docs.map(d=>{const p=d.data();return`<div class="page-item"><div><div class="page-item-name">${escHtml(p.name)}</div><div class="page-item-date">${escHtml(p.authorEmail||'')}</div></div><button class="btn btn-secondary" style="font-size:.72rem;padding:.35rem .8rem" onclick="openViewer('${d.id}')">Vue →</button></div>`;}).join('');
  }catch(e){list.innerHTML='<div class="empty-state" style="color:var(--danger)">Erreur : '+e.message+'</div>';}
}

async function openViewer(pageId){
  document.getElementById('page-viewer').classList.add('open');
  document.getElementById('viewer-page-title').textContent='Chargement…';
  try{
    const snap=await db.collection('pages').doc(pageId).get();
    if(!snap.exists)return;
    const data=snap.data();
    document.getElementById('viewer-page-title').textContent=data.name;
    document.getElementById('viewer-page-author').textContent='par '+(data.authorEmail||'anonyme');
    document.getElementById('viewer-frame').srcdoc=data.html;
  }catch(e){document.getElementById('viewer-page-title').textContent='Erreur de chargement';}
}

function closeViewer(){
  document.getElementById('page-viewer').classList.remove('open');
  document.getElementById('viewer-frame').srcdoc='';
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

setInterval(loadPages,30000);
</script>
</body>
</html>
